services:
  nuffield-bot:
    build: .
    container_name: nuffield-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/London
    # Chromium crashes with the default 64MB /dev/shm.
    shm_size: "512m"
    # Allow an in-flight headless login to unwind before SIGKILL.
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
